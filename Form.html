<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>Student Registration Form</h1>
    <form>
        <fieldset>
            <legend>Personal Information</legend>

            <label for="fullName">Full Name :</label>
            <input type="text" id="fullName" name="fullName" placeholder="Enter your full Name" required />
            <br />
            <br />
            <label for="email">Email :</label>
            <input type="email" id="email" name="email" placeholder="example@gmail.com" required />
            <br />
            <br />
            <label for="password">Password :</label>
            <input type="password" id="password" name="password" placeholder="Enter the Password" required />
            <br />
            <br />
            <label for="phNumber">Phone Number :</label>
            <input type="tel" id="phNumber" name="phNumber" placeholder="9999999999" required />
            <br />
            <br />
            <label for="dob">Date of Birth :</label>
            <input type="date" id="dob" name="dob" required />
            <br />
            <br />
            <label for="time">Preffered Time :</label>
            <input type="time" id="time" name="time" required />
            <br />
            <br />
            <p>Gender : </p>
            <input type="radio" id="male" name="gender" />
            <label for="male">Male</label>
            <input type="radio" id="female" name="gender" />
            <label for="female">Female</label>
            <input type="radio" id="other" name="gender" />
            <label for="other">Other</label>
        </fieldset>
        <fieldset>
            <legend> Academic Information</legend>
            <label for="course"> Select Course :</label>
            <select id="course" name="course" required>
                <option value="">-- Select Course --</option>
                <option value="bca">BCA</option>
                <option value="b.tech">B.Tech</option>
                <option value="mca">MCA</option>
                <option value="b.sc">B.Sc</option>
            </select>
            <br />
            <br />
            <label for="Programming">Known Programming Languages :</label><br />
            <select id="Programming" name="Programming" multiple size="4">
                <option value="html">HTML</option>
                <option value="css">CSS</option>
                <option value="js">JavaScript</option>
                <option value="java">Java</option>
            </select>
            <br />
            <br />
            <label for="age">Age :</label>
            <input type="number" id="age" name="age" required />
            <br />
            <br />
            <label for="skillLevel">Programming skills Level :</label>
            <input type="range" min="0" id="skillLevel" name="skillLevel" max="100" value="50" />
            <br />
            <br />
            <label for="city">City :</label>
            <input type="text" list="cities" id="city" name="city" />

            <datalist id="cities">
                <option value="Delhi" />
                <option value="Mumbai" />
                <option value="Chennai" />
                <option value="Kolkata" />
                <option value="Mathura" />
            </datalist>



        </fieldset>
    </form>
</body>

</html>
